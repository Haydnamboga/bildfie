name: Build Android APK

on:
  push:
    branches:
      - claude/new-project-setup-3rmmyc
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API URL for the app to connect to'
        required: false
        default: 'https://bildfie-api.up.railway.app'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Node.js 20 with corepack
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set API URL
        run: |
          API_URL="${{ github.event.inputs.api_url || 'https://bildfie-api.up.railway.app' }}"
          echo "EXPO_PUBLIC_API_URL=${API_URL}" >> apps/mobile/.env

      - name: Generate Prisma client
        run: pnpm --filter @bildfie/db generate
        env:
          DATABASE_URL: 'postgresql://localhost:5432/placeholder'

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Run Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'https://bildfie-api.up.railway.app' }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bildfie-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build summary
        run: |
          echo "## Android APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download **bildfie-android-debug** from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install on Android phone" >> $GITHUB_STEP_SUMMARY
          echo "1. Download and unzip the artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer \`app-debug.apk\` to your phone" >> $GITHUB_STEP_SUMMARY
          echo "3. Open the APK file → tap Install (allow unknown sources if prompted)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "API URL: \`${{ github.event.inputs.api_url || 'https://bildfie-api.up.railway.app' }}\`" >> $GITHUB_STEP_SUMMARY
