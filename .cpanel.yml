# Optional: cPanel "Git Version Control" auto-deploy.
# Use this ONLY if you connect this repo inside cPanel → Git Version Control
# instead of the download-the-ZIP workflow. See docs/DEPLOY-CPANEL.md.
#
# Edit DEPLOYPATH to your app folder (the directory ABOVE public_html's docroot,
# e.g. /home/cpaneluser/bildfie). Then in cPanel click "Update from Remote" → "Deploy HEAD Commit".
#
# NOTE: this copies source only. Vendor libraries are NOT in git, so after the
# first deploy open cPanel → Terminal and run, once, inside DEPLOYPATH:
#   composer install --no-dev --optimize-autoloader
#   php artisan key:generate        # only if .env has no APP_KEY yet
#   php artisan migrate --force
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANEL_USER/bildfie
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -R .env.example $DEPLOYPATH 2>/dev/null || true
